<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sign In - Doc House</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body>
    <!-- =====================================
         MAIN PAGE
    ====================================== -->

    <main class="login-page">
      <!-- =================================
             LEFT / TOP ILLUSTRATION
        ================================== -->

      <section class="illustration-section">
        <!-- Background -->

        <img src="./image/Rectangle 1.png" class="background-image" alt="" />

        <!-- Medical Plus Decoration -->

        <img src="./image/Frame.png" class="medical-decoration" alt="" />

        <!-- Doctor + Medicine -->

        <img
          src="./image/Frame 2.png"
          class="doctor-image"
          alt="Doctor illustration"
        />
      </section>

      <!-- =================================
             LOGIN SECTION
        ================================== -->

      <section class="form-section">
        <div class="login-box">
          <!-- Heading -->

          <h1>
            Sign In to Doc<br class="mobile-break" />
            House
          </h1>

          <!-- FORM -->

          <form id="loginForm">
            <!-- =========================
                         EMAIL
                    ========================== -->

            <div class="form-group">
              <label for="email"> Username or Email Address </label>

              <input
                type="email"
                id="email"
                placeholder="Enter your username or email"
                autocomplete="email"
              />

              <span id="emailError" class="error-message"></span>
            </div>

            <!-- =========================
                         PASSWORD
                    ========================== -->

            <div class="form-group">
              <div class="password-header">
                <label for="password"> Password </label>

                <a href="#" id="forgotPassword"> Forgot password? </a>
              </div>

              <div class="password-wrapper">
                <input
                  type="password"
                  id="password"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                />

                <button
                  type="button"
                  id="togglePassword"
                  class="password-toggle"
                  aria-label="Show password"
                >
                  <i class="fa-solid fa-eye"></i>
                </button>
              </div>

              <span id="passwordError" class="error-message"></span>
            </div>

            <!-- =========================
                         CREATE ACCOUNT BUTTON
                    ========================== -->

            <button
              type="submit"
              id="createAccountButton"
              class="create-account-button"
            >
              <span id="buttonText"> Create Account </span>

              <span id="loading" class="loading">
                <i class="fa-solid fa-spinner fa-spin"></i>
              </span>
            </button>

            <!-- SUCCESS MESSAGE -->

            <div id="successMessage" class="success-message"></div>
          </form>

          <!-- =========================
                     REGISTER TEXT
                ========================== -->

          <p class="register-text">
            Please register at first. Go to

            <a href="#" id="signUpLink"> SIGN UP </a>
          </p>
        </div>
      </section>
    </main>

    <!-- JavaScript -->

    <script src="index.js"></script>
  </body>
</html>
