<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Doc House - Sign In</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- =========================
         MAIN AUTH CONTAINER
    ========================== -->

    <main class="auth-container">
      <!-- =========================
             LEFT SIDE
        ========================== -->

      <section class="auth-image">
        <img src="image/Frame 2.png" alt="Doctor" />
      </section>

      <!-- =========================
             RIGHT SIDE
        ========================== -->

      <section class="auth-section">
        <!-- =====================
                 SIGN IN
            ====================== -->

        <div class="auth-box" id="signInBox">
          <h1>Welcome Back</h1>

          <p class="subtitle">Sign in to your account</p>

          <form id="signInForm">
            <!-- Email -->

            <div class="input-group">
              <label for="loginEmail"> Email </label>

              <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
              />
            </div>

            <!-- Password -->

            <div class="input-group">
              <label for="loginPassword"> Password </label>

              <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
              />
            </div>

            <!-- Remember -->

            <div class="form-options">
              <label class="remember">
                <input type="checkbox" id="rememberMe" />

                Remember me
              </label>

              <a href="#" id="forgotPassword"> Forgot password? </a>
            </div>

            <!-- Sign In Button -->

            <button type="submit" class="auth-button">Sign In</button>

            <!-- Error -->

            <p class="message error" id="signInMessage"></p>
          </form>

          <!-- Sign Up -->

          <p class="switch-text">
            Don't have an account?

            <button type="button" id="showSignUp" class="switch-button">
              Sign Up
            </button>
          </p>
        </div>

        <!-- =====================
                 SIGN UP
            ====================== -->

        <div class="auth-box hidden" id="signUpBox">
          <h1>Create Account</h1>

          <p class="subtitle">Create your Doc House account</p>

          <form id="signUpForm">
            <!-- Name -->

            <div class="input-group">
              <label for="signupName"> Full Name </label>

              <input
                type="text"
                id="signupName"
                placeholder="Enter your name"
                required
              />
            </div>

            <!-- Email -->

            <div class="input-group">
              <label for="signupEmail"> Email </label>

              <input
                type="email"
                id="signupEmail"
                placeholder="Enter your email"
                required
              />
            </div>

            <!-- Password -->

            <div class="input-group">
              <label for="signupPassword"> Password </label>

              <input
                type="password"
                id="signupPassword"
                placeholder="Create a password"
                required
                minlength="6"
              />
            </div>

            <!-- Confirm Password -->

            <div class="input-group">
              <label for="confirmPassword"> Confirm Password </label>

              <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                required
                minlength="6"
              />
            </div>

            <!-- Sign Up Button -->

            <button type="submit" class="auth-button">Create Account</button>

            <!-- Message -->

            <p class="message" id="signUpMessage"></p>
          </form>

          <!-- Back to Sign In -->

          <p class="switch-text">
            Already have an account?

            <button type="button" id="showSignIn" class="switch-button">
              Sign In
            </button>
          </p>
        </div>
      </section>
    </main>

    <script src="index.js"></script>
  </body>
</html>
